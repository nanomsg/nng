name: coverage
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "**.adoc", "**.md"]

permissions:
  contents: read

jobs:
  linux-coverage:
    name: linux
    runs-on: [ubuntu-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install mbedTLS
        run: sudo apt-get install libmbedtls-dev

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: Configure
        run: mkdir build && cd build && cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON ..

      - name: Build
        run: cd build && ninja

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Upload report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: linux

  darwin-coverage:
    name: darwin
    runs-on: [macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install mbedTLS
        run: brew install mbedtls

      - name: Install ninja
        run: brew install ninja

      - name: Install lcov
        run: brew install lcov

      - name: Configure
        run: mkdir build && cd build && cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON ..

      - name: Build
        run: cd build && ninja

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Preprocess
        run: cd build && lcov -c -d . -o lcov.info

      - name: Upload report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: macos

  windows-coverage:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-wolfssl

      - name: Install grcov
        shell: pwsh
        run: |
          $version = '0.10.7'
          $archive = "grcov-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/mozilla/grcov/releases/download/v$version/$archive"
          $destination = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$archive"
          Expand-Archive -Path "$env:RUNNER_TEMP\$archive" -DestinationPath $destination -Force
          & "$destination\grcov.exe" --version

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON -DNNG_TLS_ENGINE=wolf
          -DWOLFSSL_ROOT_DIR=/ucrt64

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage
        run: >-
          grcov build -s . --branch --ignore-not-existing
          --keep-only 'src/*' --keep-only 'include/*'
          --output-types lcov --output-path lcov.info

      - name: Upload report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: windows
