name: coverage
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.adoc", "**.md", ".github/workflows/mdbook.yml", ".github/workflows/docs-asciidoc.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "**.adoc", "**.md", ".github/workflows/mdbook.yml", ".github/workflows/docs-asciidoc.yml"]

permissions:
  contents: read

jobs:
  linux-coverage:
    name: linux (${{ matrix.tls.engine }})
    runs-on: [ubuntu-24.04]
    strategy:
      fail-fast: false
      matrix:
        tls:
          - engine: mbed
            source: mbedtls/mbedtls.c
            flag: linux
          - engine: wolf
            source: wolfssl/wolfssl.c
            flag: linux-wolf
          - engine: openssl
            source: openssl/openssl.c
            flag: linux-openssl
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcovr

      - name: Install mbedTLS
        if: matrix.tls.engine == 'mbed'
        run: sudo apt-get install -y libmbedtls-dev

      - name: Build wolfSSL with DTLS 1.3 and ML-KEM
        if: matrix.tls.engine == 'wolf'
        run: |
          curl -fsSL https://github.com/wolfSSL/wolfssl/archive/refs/tags/v5.9.1-stable.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/wolfssl-5.9.1-stable" -B "$RUNNER_TEMP/wolfssl-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/wolfssl-install" \
            -DCMAKE_C_FLAGS="-Wno-error=stringop-overflow -DHAVE_SERVER_RENEGOTIATION_INFO -DWOLFSSL_MAX_SIGALGO=128" \
            -DWOLFSSL_DTLS=yes -DWOLFSSL_DTLS13=yes -DWOLFSSL_OPENSSLALL=yes \
            -DWOLFSSL_EXPERIMENTAL=yes -DWOLFSSL_MLKEM=yes -DWOLFSSL_CURVE25519=yes \
            -DWOLFSSL_PSK=yes -DWOLFSSL_CRL=yes -DWOLFSSL_EXAMPLES=no -DWOLFSSL_CRYPT_TESTS=no
          cmake --build "$RUNNER_TEMP/wolfssl-build" --parallel 2
          cmake --install "$RUNNER_TEMP/wolfssl-build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/wolfssl-install" >> "$GITHUB_ENV"

      - name: Build OpenSSL with DTLS 1.3
        if: matrix.tls.engine == 'openssl'
        run: |
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-4.1.0-beta2/openssl-4.1.0-beta2.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-4.1.0-beta2"
          ./config --prefix="$RUNNER_TEMP/openssl-install" no-tests
          make -j2
          make install_sw
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-install" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON -DNNG_TRANSPORT_DTLS=ON
          -DNNG_TLS_ENGINE=${{ matrix.tls.engine }}

      - name: Build
        run: cmake --build build

      - name: Verify DTLS 1.3 is enabled
        if: matrix.tls.engine != 'mbed'
        run: grep -E '^NNG_(WOLFSSL|OPENSSL)_HAVE_DTLS13:INTERNAL=1$' build/CMakeCache.txt

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage
        run: >-
          gcovr --root . --object-directory build
          --filter 'src/' --filter 'include/'
          --lcov --output lcov.info

      - name: Verify DTLS coverage
        run: >-
          python3 cmake/NNGCheckCoverage.py lcov.info
          src/sp/transport/dtls/dtls.c src/supplemental/tls/${{ matrix.tls.source }}

      - name: Upload report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          disable_search: true
          # Reports are already generated; do not run gcov again at upload.
          plugins: noop
          fail_ci_if_error: true
          flags: ${{ matrix.tls.flag }}

  darwin-coverage:
    name: darwin
    runs-on: [macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install mbedTLS
        run: brew install mbedtls

      - name: Install ninja
        run: brew install ninja

      - name: Install lcov
        run: brew install lcov

      - name: Configure
        run: mkdir build && cd build && cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON -DNNG_TRANSPORT_DTLS=ON ..

      - name: Build
        run: cd build && ninja

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Preprocess
        run: cd build && lcov -c -d . -o lcov.info

      - name: Verify DTLS coverage
        run: >-
          python3 cmake/NNGCheckCoverage.py build/lcov.info
          src/sp/transport/dtls/dtls.c src/supplemental/tls/mbedtls/mbedtls.c

      - name: Upload report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          flags: macos

  windows-coverage:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcovr
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-wolfssl

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON -DNNG_TRANSPORT_DTLS=ON -DNNG_TLS_ENGINE=wolf
          -DWOLFSSL_ROOT_DIR=/ucrt64

      - name: Build
        run: cmake --build build

      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure
          && cmake -DNNG_BUILD_DIR="$PWD/build" -P cmake/NNGPrepareGcovPrefix.cmake

      - name: Collect coverage
        run: >-
          gcovr --root . --object-directory build
          --filter 'src/' --filter 'include/'
          --lcov --output lcov.info

      - name: Verify DTLS coverage
        run: >-
          python3 cmake/NNGCheckCoverage.py lcov.info
          src/sp/transport/dtls/dtls.c src/supplemental/tls/wolfssl/wolfssl.c

      - name: Upload report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          flags: windows
