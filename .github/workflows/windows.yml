name: windows
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.adoc", "**.md"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["docs/**", "**.adoc", "**.md"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: [windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: mbedtls
          triplet: x64-windows
          token: ${{ github.token }}
          github-binarycache: true

      - name: Configure
        run: cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -B build -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_TLS=ON -DNNG_TLS_ENGINE=mbed

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          cd build
          ctest -C Debug --output-on-failure
