name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Test release helper
        run: go test tools/release/main.go tools/release/main_test.go

  validate-tag:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Check tag against library version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run tools/release/main.go check "$RELEASE_TAG"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libmbedtls-dev
      - name: Configure tagged source
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNNG_ENABLE_TLS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
