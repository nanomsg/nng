name: mdbook

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/mdbook.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/mdbook.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the documentation to publish"
        required: true
        default: "v2.0.0"
        type: string
      version:
        description: "Major.minor documentation line (for example, 2.0)"
        required: true
        default: "2.0"
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      destination: ${{ steps.target.outputs.destination }}
      source_ref: ${{ steps.target.outputs.source_ref }}
    steps:
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
              echo "source_ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_ref="$RELEASE_TAG"
            version="${source_ref#v}"
            version="${version%.*}"
          else
            source_ref="$DISPATCH_SOURCE_REF"
            version="$DISPATCH_VERSION"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be major.minor; got '$version'." >&2
            exit 1
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "destination=ref/v$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ github.event_name == 'pull_request' || needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-publication-${{ needs.prepare.outputs.deploy == 'true' && 'deploy' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false

      # Keep version-switching UI and its manifest current when building a
      # historical release tag.  The manual content still comes from the tag.
      - uses: actions/checkout@v5
        with:
          path: publisher
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install shared documentation assets
        run: |
          cp publisher/docs/theme/nng-site-header.css docs/theme/
          cp publisher/docs/theme/nng-site-header.js docs/theme/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked

      - run: cargo install mdbook-indexing
      - name: Set the versioned canonical URL
        env:
          DESTINATION: ${{ needs.prepare.outputs.destination }}
        run: |
          sed -i "s|site-url = \"/ref/\"|site-url = \"/${DESTINATION}/\"|" docs/book.toml
      - run: mdbook build -d ./docs/book docs
      - name: Add the documentation version manifest
        run: cp publisher/docs/versions.json docs/book/versions.json

      - name: Prepare current stable reference redirect
        run: |
          latest_version="$(jq -er '.latest_version | strings | select(test("^/ref/v[0-9]+\\.[0-9]+/$"))' publisher/docs/versions.json)"
          mkdir -p redirect
          sed "s|__LATEST_VERSION__|$latest_version|g" publisher/docs/ref-redirect.html.in > redirect/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ needs.prepare.outputs.deploy == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          destination_dir: ./${{ needs.prepare.outputs.destination }}
          enable_jekyll: true

      # The versioned manuals are retained; obsolete unversioned assets are
      # removed so /ref/ is only a redirect to the current stable manual.
      - name: Check out published documentation
        uses: actions/checkout@v5
        if: ${{ needs.prepare.outputs.deploy == 'true' }}
        with:
          ref: gh-pages
          path: pages

      - name: Replace unversioned manual with stable redirect
        if: ${{ needs.prepare.outputs.deploy == 'true' }}
        run: |
          mkdir -p pages/ref
          for published_path in pages/ref/* pages/ref/.[!.]* pages/ref/..?*; do
            [ -e "$published_path" ] || continue
            entry="${published_path##*/}"
            case "$entry" in
              dev|v[0-9]*|index.html) continue ;;
            esac
            git -C pages rm -r --ignore-unmatch -- "ref/$entry"
          done
          cp redirect/index.html pages/ref/index.html
          git -C pages add ref/index.html
          if ! git -C pages diff --cached --quiet; then
            git -C pages config user.name "github-actions[bot]"
            git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C pages commit -m "docs: redirect unversioned reference manual"
            git -C pages push
          fi
