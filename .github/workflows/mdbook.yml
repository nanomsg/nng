name: mdbook

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/release/**"
      - ".github/workflows/mdbook.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/release/**"
      - ".github/workflows/mdbook.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the documentation to publish"
        required: true
        default: "v2.0.0"
        type: string
      version:
        description: "Major.minor documentation line (for example, 2.0)"
        required: true
        default: "2.0"
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      destination: ${{ steps.target.outputs.destination }}
      source_ref: ${{ steps.target.outputs.source_ref }}
    steps:
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "destination=ref/dev" >> "$GITHUB_OUTPUT"
              echo "source_ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_ref="$RELEASE_TAG"
            version="${source_ref#v}"
            version="${version%.*}"
          else
            source_ref="$DISPATCH_SOURCE_REF"
            version="$DISPATCH_VERSION"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be major.minor; got '$version'." >&2
            exit 1
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "destination=ref/v$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ github.event_name == 'pull_request' || needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-publication-${{ needs.prepare.outputs.deploy == 'true' && 'deploy' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false

      # Keep version-switching UI and its manifest current when building a
      # historical release tag.  The manual content still comes from the tag.
      - uses: actions/checkout@v5
        with:
          path: publisher
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install shared documentation assets
        run: |
          cp publisher/docs/theme/nng-site-header.css docs/theme/
          cp publisher/docs/theme/nng-site-header.js docs/theme/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked

      - run: cargo install mdbook-indexing
      - name: Set the versioned canonical URL
        env:
          DESTINATION: ${{ needs.prepare.outputs.destination }}
        run: |
          sed -i "s|site-url = \"/ref/\"|site-url = \"/${DESTINATION}/\"|" docs/book.toml
      - run: mdbook build -d ./docs/book docs
      - name: Add the documentation version manifest
        run: cp publisher/docs/versions.json docs/book/versions.json

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      # Publish the manual and its routing metadata in one commit, retaining
      # the deployed manifest across dev builds and historical republication.
      - name: Check out published documentation
        uses: actions/checkout@v5
        if: ${{ needs.prepare.outputs.deploy == 'true' }}
        with:
          ref: gh-pages
          path: pages

      - name: Publish manual, selector, and stable redirect
        if: ${{ needs.prepare.outputs.deploy == 'true' }}
        env:
          DESTINATION: ${{ needs.prepare.outputs.destination }}
        run: |
          go run publisher/tools/release/main.go publish-docs \
            --pages pages --book docs/book --version "${DESTINATION#ref/}" \
            --manifest publisher/docs/versions.json \
            --redirect-template publisher/docs/ref-redirect.html.in
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages config user.name "github-actions[bot]"
            git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C pages commit -m "docs: publish ${DESTINATION} and update manual routing"
            git -C pages push
          fi
