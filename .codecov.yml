# .codecov.yml
# https://docs.codecov.com/docs/codecov-yaml
#
ignore:
 - "tests"
 - "src/testing"
 - "perf"
 - "**/*_test.c"
 # Standalone peers are test executables, not library code.
 - "src/sp/transport/dtls/dtls_interop_peer.c"
 - "src/sp/transport/dtls/dtls_soak_peer.c"

coverage:
  range: 50..95
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
      linux_suite:
        target: auto
        threshold: 0.5%
        if_not_found: failure
        flags:
          - linux
      linux_wolf_suite:
        target: auto
        threshold: 0.5%
        # New flags have no base report until coverage runs on main.
        # CI separately requires executed source lines and a valid upload.
        if_not_found: success
        flags:
          - linux-wolf
      linux_openssl_suite:
        target: auto
        threshold: 0.5%
        if_not_found: success
        flags:
          - linux-openssl
      macos_suite:
        target: auto
        threshold: 0.5%
        if_not_found: failure
        flags:
          - macos
      windows_suite:
        # Reject an empty Windows report while the flag establishes its baseline.
        target: 1%
        threshold: 0%
        if_not_found: failure
        flags:
          - windows
    patch:
      default:
        target: auto
        threshold: 0.5%

codecov:
  notify:
    # Three Linux engines, macOS, and Windows.
    after_n_builds: 5

# Flag definitions to segment coverage charts by pipeline context
flags:
  linux:
    carryforward: true     # Retains the last healthy report if a rebuild omits it
  linux-wolf:
    carryforward: true
  linux-openssl:
    carryforward: true
  macos:
    carryforward: true
  windows:
    carryforward: true

# Cosmetic behavior for GitHub Pull Request Comments
comment:
  layout: "reach, diff, flags, files"
  behavior: default
